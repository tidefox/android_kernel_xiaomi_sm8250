name: build-alioth

on:
  push:
    branches: [seventeen, seventeen-nomount]
  workflow_dispatch:
    inputs:
      boot_url:
        description: "Stock boot.img URL (overrides vars.BOOT_IMG_URL)"
        required: false

env:
  ARCH: arm64
  DEVICE: alioth
  DEFCONFIG: vendor/kona-perf_defconfig
  FRAGMENTS: vendor/xiaomi/sm8250-common.config vendor/xiaomi/alioth.config

jobs:
  kernel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zip cpio python3 \
            clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo ln -sf "$(command -v ld.lld-14)" /usr/local/bin/ld.lld

      - name: Build kernel (ThinLTO)
        run: |
          export PATH=/usr/lib/llvm-14/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $MAKE_ARGS $DEFCONFIG $FRAGMENTS
          grep -E "CONFIG_(NOMOUNT|LTO_CLANG|THINLTO|MACH_XIAOMI_ALIOTH)=" out/.config
          make $MAKE_ARGS -j"$(nproc)"

      - name: Collect outputs
        run: |
          mkdir -p dist
          B=out/arch/arm64/boot
          cp $B/Image $B/Image.gz dist/
          cat $B/dts/vendor/qcom/kona*.dtb > dist/dtb
          cp $B/dts/vendor/qcom/${DEVICE}-sm8250-overlay.dtbo dist/ || true

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/modules ak3/patch ak3/ramdisk
          cat > ak3/anykernel.sh <<'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=SM8250 kernel (alioth)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=alioth
          device.name2=aliothin
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AKEOF
          cp dist/Image.gz dist/dtb ak3/
          SHA=$(git rev-parse --short HEAD)
          (cd ak3 && zip -r9 "../dist/AK3-${DEVICE}-${SHA}.zip" . -x '*.git*')

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ env.DEVICE }}
          path: |
            dist/Image
            dist/Image.gz
            dist/dtb
            dist/*.dtbo
      - uses: actions/upload-artifact@v4
        with:
          name: anykernel3-${{ env.DEVICE }}
          path: dist/AK3-*.zip

      # Repack the stock ROM boot.img (header v3: kernel + ramdisk, no dtb) with
      # our raw Image. Needs the stock image URL, which rotates on each ROM release:
      # set it as repo variable BOOT_IMG_URL or pass boot_url when dispatching.
      - name: Repack boot.img (magiskboot)
        env:
          BOOT_URL: ${{ inputs.boot_url || vars.BOOT_IMG_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BOOT_URL" ]; then
            echo "No BOOT_IMG_URL / boot_url set, skipping boot.img repack"
            exit 0
          fi
          mkdir -p mb && cd mb
          gh release download -R topjohnwu/Magisk -p 'Magisk-v*.apk'
          unzip -o -q Magisk-v*.apk lib/x86_64/libmagiskboot.so
          install -m755 lib/x86_64/libmagiskboot.so magiskboot
          curl -fsSL --retry 3 -o stock.img "$BOOT_URL"
          ./magiskboot unpack stock.img
          cp ../dist/Image kernel
          ./magiskboot repack stock.img boot-alioth.img
          cp boot-alioth.img ../dist/boot-alioth-$(git -C .. rev-parse --short HEAD).img

      - uses: actions/upload-artifact@v4
        with:
          name: boot-image-${{ env.DEVICE }}
          path: dist/boot-alioth-*.img
          if-no-files-found: ignore
